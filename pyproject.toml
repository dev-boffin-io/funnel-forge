[project]
name = "funnel-forge"
version = "0.1.0"
description = "PyQt6 GUI for managing a Tailscale Funnel"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Sumit" }
]
dependencies = [
    "PyQt6>=6.6",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[project.urls]
Homepage = "https://github.com/dev-boffin-io/funnel-forge"

[project.scripts]
funnel-forge = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "ui*"]
